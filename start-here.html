<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First 7 Days | A New Me</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#eef2f7}.app-header{display:flex;align-items:center;background:#1f3c88;color:#fff;padding:15px}.back-btn{background:#fff;color:#1f3c88;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;margin-right:15px;font-weight:700}.container{padding:20px;max-width:900px;margin:auto}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,.08)}.check-item{margin-top:10px}button{background:#1f3c88;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;margin-top:10px}.progress-text{font-weight:700;margin-top:10px}.progress-bar-container{width:100%;background:#ddd;border-radius:20px;overflow:hidden;margin-top:10px}.progress-bar{height:15px;width:0%;background:#4CAF50;transition:width .4s ease}</style>
</head>
<body>
<div class="app-header">
<button type="button" onclick="goBack()" class="back-btn">&larr; Back</button>
<div>🚀 First 7 Days After Release</div>
</div>
<div class="container">
<div class="card">
<h3>Focus Only On These Basics</h3>
<div class="check-item">
<label>
<input type="checkbox" id="task1"> Start ID process</label>
</div>
<div class="check-item">
<label>
<input type="checkbox" id="task2"> Confirm housing plan</label>
</div>
<div class="check-item">
<label>
<input type="checkbox" id="task3"> Apply for at least 5 jobs</label>
</div>
<div class="check-item">
<label>
<input type="checkbox" id="task4"> Contact probation/parole officer</label>
</div>
<div class="check-item">
<label>
<input type="checkbox" id="task5"> Create transportation plan</label>
</div>
<div class="check-item">
<label>
<input type="checkbox" id="task6"> Set 1 short-term goal</label>
</div>
<button type="button" onclick="saveProgress()">Save Progress</button>
<div class="progress-text" id="progressText" aria-live="polite">
</div>
<div class="progress-bar-container">
<div class="progress-bar" id="progressBar">
</div>
</div>
</div>
<div class="card">
<h3>Remember</h3>
<p>You do not need to fix everything in one week.</p>
<p>Stability first. Everything else comes later.</p>
</div>
</div>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA4O2nEtjdy9fSh66gnHH6jsbKKSWdJt4c",
  authDomain: "a-new-me-1a17a.firebaseapp.com",
  projectId: "a-new-me-1a17a",
  storageBucket: "a-new-me-1a17a.firebasestorage.app",
  messagingSenderId: "362235516132",
  appId: "1:362235516132:web:1465c3ec03ce1d3f4608f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;


const tasks = [
  "task1",
  "task2",
  "task3",
  "task4",
  "task5",
  "task6"
];


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = user;

  await loadProgress();

});


/* =========================
   FIREBASE REFERENCE
========================= */

function firstSevenDaysRef() {

  return doc(
    db,
    "users",
    currentUser.uid,
    "firstSevenDays",
    "progress"
  );

}


/* =========================
   UPDATE SCREEN
========================= */

function updateProgress() {

  let completed = 0;


  tasks.forEach((task) => {

    if (
      document.getElementById(task)
        .checked
    ) {

      completed++;

    }

  });


  const percent =
    Math.round(
      (completed / tasks.length) * 100
    );


  document.getElementById(
    "progressText"
  ).textContent =
    `Progress: ${completed} of ${tasks.length} completed`;


  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";


  return {
    completed,
    percent
  };

}


/* =========================
   SAVE PROGRESS
========================= */

window.saveProgress =
async function() {

  if (!currentUser) return;


  const taskData = {};


  tasks.forEach((task) => {

    taskData[task] =
      document.getElementById(task)
        .checked;

  });


  const progress =
    updateProgress();


  try {

    await setDoc(
      firstSevenDaysRef(),
      {
        tasks: taskData,

        completedCount:
          progress.completed,

        totalTasks:
          tasks.length,

        percent:
          progress.percent,

        completed:
          progress.completed ===
          tasks.length,

        updatedAt:
          new Date().toISOString()
      },
      {
        merge: true
      }
    );

  } catch (error) {

    console.error(
      "First 7 Days save error:",
      error
    );


    document.getElementById(
      "progressText"
    ).textContent =
      "Progress could not be saved.";

  }

};


/* =========================
   LOAD PROGRESS
========================= */

async function loadProgress() {

  if (!currentUser) return;


  try {

    const snapshot =
      await getDoc(
        firstSevenDaysRef()
      );


    if (snapshot.exists()) {

      const data =
        snapshot.data();


      const savedTasks =
        data.tasks || {};


      tasks.forEach((task) => {

        document.getElementById(
          task
        ).checked =
          savedTasks[task] === true;

      });

    }


    updateProgress();


  } catch (error) {

    console.error(
      "First 7 Days load error:",
      error
    );

  }

}


/* =========================
   BACK
========================= */

window.goBack =
function() {

  if (document.referrer) {

    history.back();

  } else {

    window.location.href =
      "index.html";

  }

};

</script>
</body>
</html>
