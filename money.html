<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Plan | A New Me</title>
<style>body{margin:0;font-family:Arial;background:#eef2f7}.app-header{display:flex;align-items:center;background:#1f3c88;color:#fff;padding:15px}.back-btn{background:#fff;color:#1f3c88;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;margin-right:15px;font-weight:700}.container{padding:20px;max-width:900px;margin:auto}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,.08)}input{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#1f3c88;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;margin-top:10px}.success{margin-top:10px;color:green;font-weight:700}</style>
</head>
<body>
<div class="app-header">
<button type="button" onclick="goBack()" class="back-btn">&larr; Back</button>
<div>Financial Stability</div>
</div>
<div class="container">
<div class="card">
<h3>💵 Monthly Income</h3>
<label for="income">Total Monthly Income:</label>
<input type="number" id="income">
</div>
<div class="card">
<h3>💳 Monthly Expenses</h3>
<label for="rent">Rent:</label>
<input type="number" id="rent">
<label for="utilities">Utilities:</label>
<input type="number" id="utilities">
<label for="food">Food:</label>
<input type="number" id="food">
<label for="transportation">Transportation:</label>
<input type="number" id="transportation">
<label for="other">Other:</label>
<input type="number" id="other">
<button type="button" onclick="calculateBudget()">Calculate Budget</button>
<div id="budgetResult" class="success" aria-live="polite">
</div>
</div>
<div class="card">
<h3>🏦 Savings Goal</h3>
<label for="savingsGoal">How much do I want to save?</label>
<input type="number" id="savingsGoal">
<button type="button" onclick="saveMoneyPlan()">Save Financial Plan</button>
<div id="savedMessage" class="success" aria-live="polite">
</div>
</div>
</div>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA4O2nEtjdy9fSh66gnHH6jsbKKSWdJt4c",
  authDomain: "a-new-me-1a17a.firebaseapp.com",
  projectId: "a-new-me-1a17a",
  storageBucket: "a-new-me-1a17a.firebasestorage.app",
  messagingSenderId: "362235516132",
  appId: "1:362235516132:web:1465c3ec03ce1d3f4608f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = user;

  await loadMoneyPlan();

});


/* =========================
   BACK
========================= */

window.goBack = function() {

  if (document.referrer) {
    history.back();
  } else {
    window.location.href = "index.html";
  }

};


/* =========================
   FIREBASE REFERENCE
========================= */

function moneyRef() {

  return doc(
    db,
    "users",
    currentUser.uid,
    "money",
    "plan"
  );

}


/* =========================
   CALCULATE BUDGET
========================= */

window.calculateBudget = function() {

  const numberValue = (id) =>
    parseFloat(
      document.getElementById(id).value
    ) || 0;


  const income =
    numberValue("income");


  const expenses =
    numberValue("rent") +
    numberValue("utilities") +
    numberValue("food") +
    numberValue("transportation") +
    numberValue("other");


  const remaining =
    income - expenses;


  document.getElementById(
    "budgetResult"
  ).textContent =
    "Remaining after expenses: $" +
    remaining.toFixed(2);

};


/* =========================
   SAVE FINANCIAL PLAN
========================= */

window.saveMoneyPlan =
async function() {

  if (!currentUser) return;


  const ids = [
    "income",
    "rent",
    "utilities",
    "food",
    "transportation",
    "other",
    "savingsGoal"
  ];


  const plan = {};


  ids.forEach((id) => {

    plan[id] =
      document.getElementById(id).value;

  });


  const income =
    parseFloat(plan.income) || 0;


  const totalExpenses =
    (parseFloat(plan.rent) || 0) +
    (parseFloat(plan.utilities) || 0) +
    (parseFloat(plan.food) || 0) +
    (parseFloat(plan.transportation) || 0) +
    (parseFloat(plan.other) || 0);


  const remaining =
    income - totalExpenses;


  const completed =
    Boolean(
      plan.income &&
      plan.savingsGoal
    );


  try {

    await setDoc(
      moneyRef(),
      {
        ...plan,

        totalExpenses:
          totalExpenses,

        remaining:
          remaining,

        completed:
          completed,

        updatedAt:
          new Date().toISOString()
      },
      {
        merge: true
      }
    );


    document.getElementById(
      "budgetResult"
    ).textContent =
      "Remaining after expenses: $" +
      remaining.toFixed(2);


    document.getElementById(
      "savedMessage"
    ).textContent =
      "Financial plan saved.";


  } catch (error) {

    console.error(
      "Financial plan save error:",
      error
    );


    document.getElementById(
      "savedMessage"
    ).textContent =
      "Financial plan could not be saved.";

  }

};


/* =========================
   LOAD FINANCIAL PLAN
========================= */

async function loadMoneyPlan() {

  if (!currentUser) return;


  try {

    const snapshot =
      await getDoc(
        moneyRef()
      );


    if (!snapshot.exists()) {
      return;
    }


    const saved =
      snapshot.data();


    const ids = [
      "income",
      "rent",
      "utilities",
      "food",
      "transportation",
      "other",
      "savingsGoal"
    ];


    ids.forEach((id) => {

      document.getElementById(id).value =
        saved[id] ?? "";

    });


    if (
      saved.remaining !== undefined
    ) {

      document.getElementById(
        "budgetResult"
      ).textContent =
        "Remaining after expenses: $" +
        Number(
          saved.remaining
        ).toFixed(2);

    }


    document.getElementById(
      "savedMessage"
    ).textContent =
      "Your saved financial plan is loaded.";


  } catch (error) {

    console.error(
      "Financial plan load error:",
      error
    );

  }

}

</script>
</body>
</html>
