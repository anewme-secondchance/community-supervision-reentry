<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family | A New Me</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
}

.app-header {
  display: flex;
  align-items: center;
  background: #1f3c88;
  color: white;
  padding: 15px;
}

.back-btn {
  background: white;
  color: #1f3c88;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  margin-right: 15px;
}

.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
  padding-bottom: 80px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

textarea, input {
  width: 100%;
  min-height: 90px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 10px;
  box-sizing: border-box;
}

input {
  min-height: 44px;
}

button {
  background: #1f3c88;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}

.save-msg {
  color: green;
  font-size: 14px;
  margin-top: 5px;
}

.task-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #f4f6fb;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
}

.completed {
  text-decoration: line-through;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="app-header">
  <button type="button" onclick="goBack()" class="back-btn">&larr; Back</button>
  <div>👨‍👩‍👧 Family Rebuilding</div>
</div>

<div class="container">

<div class="card">
<h3>Reunification Plan</h3>
<label for="reunificationPlan">Write your reunification goals and action steps.</label>
<textarea id="reunificationPlan" placeholder="Write your reunification goals and action steps..."></textarea>
<div class="save-msg" id="planMsg" aria-live="polite"></div>
</div>

<div class="card">
<h3>Trust Building Commitments</h3>
<label for="trustPlan">How will you rebuild trust? Be specific.</label>
<textarea id="trustPlan" placeholder="How will you rebuild trust? Be specific..."></textarea>
<div class="save-msg" id="trustMsg" aria-live="polite"></div>
</div>

<div class="card">
<h3>Consistency Tracker</h3>
<label for="taskInput">Add one weekly family commitment.</label>
<input type="text" id="taskInput" placeholder="Example: Call my child every Sunday">
<button type="button" onclick="addTask()">Add Commitment</button>
<div class="save-msg" id="taskMsg" aria-live="polite"></div>
<div id="taskList"></div>
</div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA4O2nEtjdy9fSh66gnHH6jsbKKSWdJt4c",
  authDomain: "a-new-me-1a17a.firebaseapp.com",
  projectId: "a-new-me-1a17a",
  storageBucket: "a-new-me-1a17a.firebasestorage.app",
  messagingSenderId: "362235516132",
  appId: "1:362235516132:web:1465c3ec03ce1d3f4608f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

let familyData = {
  reunification: "",
  trust: "",
  tasks: []
};


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = user;

  await loadFamilyData();

  setupFamilyInputs();

});


/* =========================
   FIREBASE REFERENCE
========================= */

function familyRef() {

  return doc(
    db,
    "users",
    currentUser.uid,
    "family",
    "plan"
  );

}


/* =========================
   LOAD FAMILY DATA
========================= */

async function loadFamilyData() {

  if (!currentUser) return;

  try {

    const snapshot =
      await getDoc(
        familyRef()
      );


    if (snapshot.exists()) {

      familyData = {
        ...familyData,
        ...snapshot.data()
      };

    }


    document.getElementById(
      "reunificationPlan"
    ).value =
      familyData.reunification || "";


    document.getElementById(
      "trustPlan"
    ).value =
      familyData.trust || "";


    if (!Array.isArray(familyData.tasks)) {
      familyData.tasks = [];
    }


    renderTasks();

  } catch (error) {

    console.error(
      "Family data load error:",
      error
    );

  }

}


/* =========================
   SAVE FAMILY DATA
========================= */

async function saveFamilyData() {

  if (!currentUser) return;

  try {

    await setDoc(
      familyRef(),
      {
        reunification:
          familyData.reunification || "",

        trust:
          familyData.trust || "",

        tasks:
          familyData.tasks || [],

        updatedAt:
          new Date().toISOString()
      },
      {
        merge: true
      }
    );

  } catch (error) {

    console.error(
      "Family data save error:",
      error
    );

  }

}


/* =========================
   TEXT INPUTS
========================= */

function setupFamilyInputs() {

  document.getElementById(
    "reunificationPlan"
  ).addEventListener(
    "input",
    async function() {

      familyData.reunification =
        this.value;

      await saveFamilyData();

      document.getElementById(
        "planMsg"
      ).textContent =
        "Saved.";

    }
  );


  document.getElementById(
    "trustPlan"
  ).addEventListener(
    "input",
    async function() {

      familyData.trust =
        this.value;

      await saveFamilyData();

      document.getElementById(
        "trustMsg"
      ).textContent =
        "Saved.";

    }
  );

}


/* =========================
   ADD COMMITMENT
========================= */

window.addTask =
async function() {

  if (!currentUser) return;


  const input =
    document.getElementById(
      "taskInput"
    );


  const text =
    input.value.trim();


  if (!text) {

    document.getElementById(
      "taskMsg"
    ).textContent =
      "Enter a commitment first.";

    return;

  }


  familyData.tasks.push({
    text: text,
    completed: false
  });


  await saveFamilyData();


  input.value = "";


  document.getElementById(
    "taskMsg"
  ).textContent =
    "Commitment added.";


  renderTasks();

};


/* =========================
   RENDER COMMITMENTS
========================= */

function renderTasks() {

  const list =
    document.getElementById(
      "taskList"
    );


  list.innerHTML = "";


  familyData.tasks.forEach(
    (task, index) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "task-item" +
        (
          task.completed
            ? " completed"
            : ""
        );


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        task.text || "";


      const buttons =
        document.createElement(
          "div"
        );


      const toggleButton =
        document.createElement(
          "button"
        );


      toggleButton.type =
        "button";


      toggleButton.textContent =
        task.completed
          ? "Undo"
          : "Done";


      toggleButton.addEventListener(
        "click",
        () => {
          toggleTask(index);
        }
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.type =
        "button";

      deleteButton.textContent =
        "X";


      deleteButton.addEventListener(
        "click",
        () => {
          deleteTask(index);
        }
      );


      buttons.appendChild(
        toggleButton
      );


      buttons.appendChild(
        deleteButton
      );


      div.appendChild(span);
      div.appendChild(buttons);

      list.appendChild(div);

    }
  );

}


/* =========================
   COMPLETE / UNDO
========================= */

async function toggleTask(index) {

  if (!familyData.tasks[index]) {
    return;
  }


  familyData.tasks[index].completed =
    !familyData.tasks[index].completed;


  await saveFamilyData();

  renderTasks();

}


/* =========================
   DELETE COMMITMENT
========================= */

async function deleteTask(index) {

  if (!familyData.tasks[index]) {
    return;
  }


  const confirmed =
    confirm(
      "Delete this family commitment?"
    );


  if (!confirmed) {
    return;
  }


  familyData.tasks.splice(
    index,
    1
  );


  await saveFamilyData();

  renderTasks();

}


/* =========================
   BACK
========================= */

window.goBack =
function() {

  if (document.referrer) {

    history.back();

  } else {

    window.location.href =
      "index.html";

  }

};

</script>

</body>
</html>
