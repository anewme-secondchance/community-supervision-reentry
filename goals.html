<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals | A New Me</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
}

.app-header {
  display: flex;
  align-items: center;
  background: #1f3c88;
  color: white;
  padding: 15px;
}

.back-btn {
  background: white;
  color: #1f3c88;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  margin-right: 15px;
  font-weight: bold;
}

.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 8px;
  box-sizing: border-box;
}

button.action-btn {
  background: #1f3c88;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}

.goal-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f4f6fb;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
  gap: 10px;
}

.goal-item.completed {
  text-decoration: line-through;
  opacity: 0.6;
}

.progress-container {
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  height: 12px;
  background: #1f3c88;
  width: 0%;
  transition: width 0.3s ease;
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  background: red;
  top: 0;
  animation: fall 2s linear forwards;
}

.save-msg {
  color: #166534;
  margin-top: 8px;
  font-weight: bold;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="app-header">
  <button type="button" onclick="goBack()" class="back-btn">&larr; Back</button>
  <div>🎯 Goals Tracker</div>
</div>

<div class="container">

<div style="text-align:center; padding: 20px 10px;">
  <h2 style="margin:0; color:#1f3c88;">Stay on Top of Your Goals</h2>
  <p style="margin-top:8px; color:#555;">
    Small steps every day build long-term success.
  </p>
</div>

<div class="card">
<h3>Your Progress</h3>
<div id="progressText"></div>
<div class="progress-container">
  <div class="progress-bar" id="progressBar"></div>
</div>
<p id="streakText"></p>
</div>

<div class="card">
<h3>Add Personal Goal</h3>
<label for="goalInput">Add one goal</label>
<input type="text" id="goalInput" placeholder="Example: Apply for 5 jobs this week">
<button class="action-btn" type="button" onclick="addGoal()">Add Goal</button>
<p id="goalMsg" class="save-msg" aria-live="polite"></p>
</div>

<div class="card">
<h3>Your Goals</h3>
<div id="goalsList"></div>
</div>

<div class="card">
<h3>🔒 Reentry Stability Goals</h3>
<p>Track important first steps after release:</p>
<div id="reentryGoals"></div>
</div>

</div>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA4O2nEtjdy9fSh66gnHH6jsbKKSWdJt4c",
  authDomain: "a-new-me-1a17a.firebaseapp.com",
  projectId: "a-new-me-1a17a",
  storageBucket: "a-new-me-1a17a.firebasestorage.app",
  messagingSenderId: "362235516132",
  appId: "1:362235516132:web:1465c3ec03ce1d3f4608f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

let goals = [];

let reentry = {
  id: false,
  housing: false,
  employment: false,
  probation: false,
  savings: false
};

let streak = 0;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  currentUser = user;

  await loadGoalSettings();
  await loadGoals();

});


/* =========================
   BACK
========================= */

window.goBack = function() {

  if (document.referrer) {
    history.back();
  } else {
    window.location.href = "index.html";
  }

};


/* =========================
   SETTINGS REFERENCE
========================= */

function settingsRef() {

  return doc(
    db,
    "users",
    currentUser.uid,
    "goalSettings",
    "main"
  );

}


/* =========================
   LOAD GOAL SETTINGS
========================= */

async function loadGoalSettings() {

  try {

    const snapshot =
      await getDoc(settingsRef());

    if (snapshot.exists()) {

      const data = snapshot.data();

      streak =
        Number(data.streak) || 0;

      reentry = {
        id:
          Boolean(
            data.reentry?.id
          ),

        housing:
          Boolean(
            data.reentry?.housing
          ),

        employment:
          Boolean(
            data.reentry?.employment
          ),

        probation:
          Boolean(
            data.reentry?.probation
          ),

        savings:
          Boolean(
            data.reentry?.savings
          )
      };

    }

    renderReentry();

  } catch (error) {

    console.error(
      "Goal settings load error:",
      error
    );

  }

}


/* =========================
   LOAD PERSONAL GOALS
========================= */

async function loadGoals() {

  try {

    const q = query(

      collection(
        db,
        "users",
        currentUser.uid,
        "goals"
      ),

      orderBy(
        "createdAt",
        "asc"
      )

    );

    const snapshot =
      await getDocs(q);

    goals = [];

    snapshot.forEach(
      (documentSnapshot) => {

        goals.push({

          id:
            documentSnapshot.id,

          ...documentSnapshot.data()

        });

      }
    );

    renderGoals();

  } catch (error) {

    console.error(
      "Goals load error:",
      error
    );

    document.getElementById(
      "goalMsg"
    ).textContent =
      "Goals could not be loaded.";

  }

}


/* =========================
   PROGRESS
========================= */

async function updateProgress() {

  const total =
    goals.length;

  const completed =
    goals.filter(
      goal => goal.completed
    ).length;

  const percent =
    total === 0
      ? 0
      : Math.round(
          (completed / total) * 100
        );


  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";


  document.getElementById(
    "progressText"
  ).textContent =
    percent +
    "% of personal goals completed";


  document.getElementById(
    "streakText"
  ).textContent =
    "🔥 Completion Streak: " +
    streak;


  if (!currentUser) {
    return;
  }


  try {

    await setDoc(

      settingsRef(),

      {
        streak: streak,

        goalsCompleted:
          completed,

        goalsTotal:
          total,

        goalsPercent:
          percent,

        reentry:
          reentry,

        updatedAt:
          new Date().toISOString()
      },

      {
        merge: true
      }

    );

  } catch (error) {

    console.error(
      "Progress save error:",
      error
    );

  }

}


/* =========================
   RENDER GOALS
========================= */

function renderGoals() {

  const list =
    document.getElementById(
      "goalsList"
    );

  list.innerHTML = "";


  if (goals.length === 0) {

    const empty =
      document.createElement("p");

    empty.textContent =
      "No personal goals added yet.";

    list.appendChild(empty);

  }


  goals.forEach((goal) => {

    const div =
      document.createElement("div");

    div.className =
      "goal-item" +
      (
        goal.completed
          ? " completed"
          : ""
      );


    const text =
      document.createElement("span");

    text.textContent =
      goal.text || "Goal";


    const buttons =
      document.createElement("div");


    const done =
      document.createElement("button");

    done.type =
      "button";

    done.textContent =
      goal.completed
        ? "Undo"
        : "Done";

    done.onclick =
      function() {

        toggleGoal(
          goal.id,
          Boolean(goal.completed)
        );

      };


    const remove =
      document.createElement("button");

    remove.type =
      "button";

    remove.textContent =
      "X";

    remove.onclick =
      function() {

        deleteGoal(goal.id);

      };


    buttons.appendChild(done);
    buttons.appendChild(remove);

    div.appendChild(text);
    div.appendChild(buttons);

    list.appendChild(div);

  });


  updateProgress();

}


/* =========================
   ADD GOAL
========================= */

window.addGoal =
async function() {

  if (!currentUser) {
    return;
  }


  const input =
    document.getElementById(
      "goalInput"
    );


  const text =
    input.value.trim();


  if (!text) {

    document.getElementById(
      "goalMsg"
    ).textContent =
      "Enter a goal first.";

    return;

  }


  try {

    await addDoc(

      collection(
        db,
        "users",
        currentUser.uid,
        "goals"
      ),

      {
        text: text,

        completed: false,

        createdAt:
          new Date().toISOString()
      }

    );


    input.value = "";


    document.getElementById(
      "goalMsg"
    ).textContent =
      "Goal added.";


    await loadGoals();


  } catch (error) {

    console.error(
      "Add goal error:",
      error
    );


    document.getElementById(
      "goalMsg"
    ).textContent =
      "Goal could not be saved.";

  }

};


/* =========================
   COMPLETE / UNDO GOAL
========================= */

window.toggleGoal =
async function(id, currentStatus) {

  if (!currentUser) {
    return;
  }


  const newStatus =
    !currentStatus;


  try {

    await updateDoc(

      doc(
        db,
        "users",
        currentUser.uid,
        "goals",
        id
      ),

      {
        completed:
          newStatus,

        updatedAt:
          new Date().toISOString()
      }

    );


    if (newStatus) {

      streak++;

      showMotivation();
      launchConfetti();

    } else {

      /*
      Undo does not add another
      completion to the streak.
      */

      streak =
        Math.max(
          streak - 1,
          0
        );

    }


    await setDoc(

      settingsRef(),

      {
        streak: streak
      },

      {
        merge: true
      }

    );


    await loadGoals();


  } catch (error) {

    console.error(
      "Goal update error:",
      error
    );

  }

};


/* =========================
   DELETE GOAL
========================= */

window.deleteGoal =
async function(id) {

  if (!currentUser) {
    return;
  }


  const confirmed =
    confirm(
      "Delete this goal?"
    );


  if (!confirmed) {
    return;
  }


  try {

    await deleteDoc(

      doc(
        db,
        "users",
        currentUser.uid,
        "goals",
        id
      )

    );


    await loadGoals();


  } catch (error) {

    console.error(
      "Delete goal error:",
      error
    );

  }

};


/* =========================
   MOTIVATION
========================= */

function showMotivation() {

  const messages = [

    "Great job! Keep going!",

    "Momentum builds success!",

    "You’re doing this!",

    "Progress over perfection!",

    "Every win counts!"

  ];


  alert(
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ]
  );

}


/* =========================
   CONFETTI
========================= */

function launchConfetti() {

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "confetti";


    div.style.left =
      Math.random() *
      100 +
      "vw";


    div.style.background =
      `hsl(${
        Math.random() * 360
      }, 70%, 50%)`;


    document.body.appendChild(
      div
    );


    setTimeout(
      () => div.remove(),
      2000
    );

  }

}


/* =========================
   REENTRY GOALS
========================= */

function renderReentry() {

  const container =
    document.getElementById(
      "reentryGoals"
    );

  container.innerHTML = "";


  const checklist = [

    {
      key: "id",
      label:
        "Obtain State ID / Driver License"
    },

    {
      key: "housing",
      label:
        "Secure Stable Housing"
    },

    {
      key: "employment",
      label:
        "Apply for Employment or Training"
    },

    {
      key: "probation",
      label:
        "Meet All Probation Requirements"
    },

    {
      key: "savings",
      label:
        "Start $500 Emergency Fund"
    }

  ];


  checklist.forEach(
    (item) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "goal-item" +
        (
          reentry[item.key]
            ? " completed"
            : ""
        );


      const text =
        document.createElement(
          "span"
        );

      text.textContent =
        item.label;


      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";


      button.textContent =
        reentry[item.key]
          ? "Completed"
          : "Mark Done";


      button.onclick =
        function() {

          toggleReentry(
            item.key
          );

        };


      div.appendChild(text);
      div.appendChild(button);

      container.appendChild(div);

    }
  );

}


/* =========================
   TOGGLE REENTRY GOAL
========================= */

window.toggleReentry =
async function(key) {

  if (!currentUser) {
    return;
  }


  if (
    !Object.prototype.hasOwnProperty.call(
      reentry,
      key
    )
  ) {
    return;
  }


  reentry[key] =
    !reentry[key];


  renderReentry();


  try {

    await setDoc(

      settingsRef(),

      {
        reentry:
          reentry,

        updatedAt:
          new Date().toISOString()
      },

      {
        merge: true
      }

    );


  } catch (error) {

    console.error(
      "Reentry goal save error:",
      error
    );

  }

};

</script>
</body>
</html>
