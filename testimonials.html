<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonials | A New Me</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #eef2f7;
}
.header {
  background: linear-gradient(135deg, #1f3c88, #2a5298);
  color: #fff;
  padding: 20px;
  text-align: center;
  position: relative;
}
.back-btn {
  position: absolute;
  left: 15px;
  top: 18px;
  background: #fff;
  color: #1f3c88;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 700;
}
.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,.08);
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
button {
  background: #1f3c88;
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}
.quote {
  font-style: italic;
  margin-bottom: 10px;
}
.name {
  font-weight: 700;
  color: #1f3c88;
}
</style>
</head>
<body>
<div class="header">
  <button type="button" onclick="goBack()" class="back-btn">&larr; Back</button>
  <h2>💬 Community Testimonials</h2>
</div>
<div class="container">

  <div id="testimonialList"></div>

  <div class="card">
    <h3>Share Your Experience</h3>
    <input type="text" id="nameInput" placeholder="First name or initials">
    <textarea id="testimonialInput" rows="4" placeholder="How has A New Me helped you?"></textarea>
    <button type="button" onclick="addTestimonial()">Submit</button>
    <p id="submitMsg" aria-live="polite"></p>
  </div>

</div>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyA4O2nEtjdy9fSh66gnHH6jsbKKSWdJt4c",
  authDomain: "a-new-me-1a17a.firebaseapp.com",
  projectId: "a-new-me-1a17a",
  storageBucket: "a-new-me-1a17a.firebasestorage.app",
  messagingSenderId: "362235516132",
  appId: "1:362235516132:web:1465c3ec03ce1d3f4608f1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;


const testimonialListEl =
  document.getElementById(
    "testimonialList"
  );

const nameInputEl =
  document.getElementById(
    "nameInput"
  );

const testimonialInputEl =
  document.getElementById(
    "testimonialInput"
  );

const submitMsgEl =
  document.getElementById(
    "submitMsg"
  );


/* =========================
   BUILT-IN TESTIMONIALS
========================= */

const builtInTestimonials = [

  {
    name: "Marcus T.",
    text: "After returning home, I used A New Me to build my resume and find employment. Within two months I had a steady job and my own apartment."
  },

  {
    name: "Danielle R.",
    text: "The housing and ID resources helped me get back on my feet. Having everything in one place made the process much easier."
  },

  {
    name: "James W.",
    text: "The First 7 Days checklist helped me stay focused and organized. I was able to complete important tasks without feeling overwhelmed."
  },

  {
    name: "Sarah K.",
    text: "I used the education section to plan my GED and college goals. It gave me confidence that I could continue my education."
  }

];


let approvedTestimonials = [];


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "auth.html";

      return;

    }

    currentUser = user;

    await loadTestimonials();

  }
);


/* =========================
   LOAD APPROVED
   TESTIMONIALS
========================= */

async function loadTestimonials() {

  try {

    const approvedQuery =
      query(
        collection(
          db,
          "testimonials"
        ),
        where(
          "status",
          "==",
          "approved"
        )
      );


    const snapshot =
      await getDocs(
        approvedQuery
      );


    approvedTestimonials = [];


    snapshot.forEach(
      (documentSnapshot) => {

        const data =
          documentSnapshot.data();


        approvedTestimonials.push({

          name:
            data.name || "Anonymous",

          text:
            data.text || ""

        });

      }
    );


    renderTestimonials();


  } catch (error) {

    console.error(
      "Testimonials load error:",
      error
    );


    /*
      Still display the built-in
      testimonials if Firebase
      cannot load.
    */

    approvedTestimonials = [];

    renderTestimonials();

  }

}


/* =========================
   RENDER TESTIMONIALS
========================= */

function renderTestimonials() {

  testimonialListEl.innerHTML = "";


  const allTestimonials = [
    ...builtInTestimonials,
    ...approvedTestimonials
  ];


  allTestimonials.forEach(
    (item) => {

      const card =
        document.createElement(
          "div"
        );

      card.className = "card";


      const quote =
        document.createElement(
          "div"
        );

      quote.className = "quote";

      quote.textContent =
        `"${item.text}"`;


      const name =
        document.createElement(
          "div"
        );

      name.className = "name";

      name.textContent =
        `– ${item.name}`;


      card.appendChild(quote);

      card.appendChild(name);

      testimonialListEl.appendChild(
        card
      );

    }
  );

}


/* =========================
   SUBMIT TESTIMONIAL
========================= */

window.addTestimonial =
async function() {

  if (!currentUser) return;


  const name =
    nameInputEl.value.trim();


  const text =
    testimonialInputEl.value.trim();


  if (!name || !text) {

    submitMsgEl.textContent =
      "Please complete both fields.";

    return;

  }


  if (name.length > 60) {

    submitMsgEl.textContent =
      "Please use a shorter name or initials.";

    return;

  }


  if (text.length > 1500) {

    submitMsgEl.textContent =
      "Please shorten your testimonial.";

    return;

  }


  try {

    await addDoc(
      collection(
        db,
        "testimonials"
      ),
      {
        name: name,

        text: text,

        status: "pending",

        submittedBy:
          currentUser.uid,

        createdAt:
          serverTimestamp()
      }
    );


    nameInputEl.value = "";

    testimonialInputEl.value = "";


    submitMsgEl.textContent =
      "Thank you! Your testimonial was submitted for review.";


  } catch (error) {

    console.error(
      "Testimonial submit error:",
      error
    );


    submitMsgEl.textContent =
      "Your testimonial could not be submitted.";

  }

};


/* =========================
   BACK
========================= */

window.goBack =
function() {

  if (document.referrer) {

    history.back();

  } else {

    window.location.href =
      "index.html";

  }

};

</script>
</body>
</html>
